<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Client Invoice Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; padding: 0 !important; }
            .invoice-box { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto">
        <div class="no-print flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black text-slate-800">Quick Invoice Generator</h1>
                <p class="text-slate-500 text-sm">Fill in client details and download or print directly.</p>
            </div>
            <button onclick="window.print()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-6 py-2.5 rounded-xl shadow-lg transition">
                🖨 Print / Save as PDF
            </button>
        </div>

        <div class="invoice-box bg-white p-10 rounded-2xl border border-slate-200 shadow-xl space-y-8">
            <div class="flex justify-between items-start border-b border-slate-100 pb-6">
                <div>
                    <h2 class="text-3xl font-black text-indigo-600 tracking-tight">INVOICE</h2>
                    <input type="text" value="INV-2026-0042" class="text-slate-500 text-sm mt-1 border-none focus:ring-0 p-0 font-medium">
                </div>
                <div class="text-right">
                    <input type="text" value="Your Business Name" class="font-bold text-lg text-right border-none focus:ring-0 p-0 block">
                    <input type="text" value="billing@yourdomain.com" class="text-sm text-slate-500 text-right border-none focus:ring-0 p-0 block">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-8">
                <div>
                    <p class="text-xs uppercase font-bold text-slate-400 tracking-wider">Billed To:</p>
                    <input type="text" value="Acme Global Corporation" class="font-bold text-slate-800 mt-1 border-none focus:ring-0 p-0 block w-full">
                    <input type="text" value="contact@acme.com" class="text-sm text-slate-500 border-none focus:ring-0 p-0 block w-full">
                </div>
                <div class="text-right">
                    <p class="text-xs uppercase font-bold text-slate-400 tracking-wider">Invoice Date:</p>
                    <input type="date" value="2026-10-20" class="text-sm font-semibold text-slate-700 border-none focus:ring-0 p-0 text-right">
                    <p class="text-xs uppercase font-bold text-slate-400 tracking-wider mt-2">Due Date:</p>
                    <input type="date" value="2026-11-04" class="text-sm font-semibold text-slate-700 border-none focus:ring-0 p-0 text-right">
                </div>
            </div>

            <table class="w-full text-left">
                <thead>
                    <tr class="border-b-2 border-slate-100 text-xs uppercase font-bold text-slate-400">
                        <th class="py-3">Description</th>
                        <th class="py-3 text-right">Hours/Qty</th>
                        <th class="py-3 text-right">Rate ($)</th>
                        <th class="py-3 text-right">Amount ($)</th>
                    </tr>
                </thead>
                <tbody id="lineItems">
                    <tr class="border-b border-slate-50">
                        <td class="py-3"><input type="text" value="AI Workflow Development & Setup" class="w-full border-none focus:ring-0 p-0 font-medium text-slate-800"></td>
                        <td class="py-3 text-right"><input type="number" value="20" oninput="recalc()" class="qty w-16 text-right border-none focus:ring-0 p-0 text-slate-700"></td>
                        <td class="py-3 text-right"><input type="number" value="125" oninput="recalc()" class="rate w-20 text-right border-none focus:ring-0 p-0 text-slate-700"></td>
                        <td class="py-3 text-right font-bold text-slate-900 total-cell">$2,500.00</td>
                    </tr>
                    <tr class="border-b border-slate-50">
                        <td class="py-3"><input type="text" value="Database Architecture & API Integration" class="w-full border-none focus:ring-0 p-0 font-medium text-slate-800"></td>
                        <td class="py-3 text-right"><input type="number" value="12" oninput="recalc()" class="qty w-16 text-right border-none focus:ring-0 p-0 text-slate-700"></td>
                        <td class="py-3 text-right"><input type="number" value="125" oninput="recalc()" class="rate w-20 text-right border-none focus:ring-0 p-0 text-slate-700"></td>
                        <td class="py-3 text-right font-bold text-slate-900 total-cell">$1,500.00</td>
                    </tr>
                </tbody>
            </table>

            <div class="flex justify-end pt-4">
                <div class="w-64 space-y-2 text-right">
                    <div class="flex justify-between text-sm text-slate-600">
                        <span>Subtotal:</span>
                        <span id="subtotal" class="font-semibold">$4,000.00</span>
                    </div>
                    <div class="flex justify-between text-sm text-slate-600">
                        <span>Tax (10%):</span>
                        <span id="tax" class="font-semibold">$400.00</span>
                    </div>
                    <div class="flex justify-between text-xl font-black text-indigo-600 border-t border-slate-200 pt-2">
                        <span>Total Due:</span>
                        <span id="grandTotal">$4,400.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function recalc() {
            let subtotal = 0;
            const rows = document.querySelectorAll('#lineItems tr');
            rows.forEach(r => {
                const qty = parseFloat(r.querySelector('.qty').value) || 0;
                const rate = parseFloat(r.querySelector('.rate').value) || 0;
                const total = qty * rate;
                r.querySelector('.total-cell').innerText = '$' + total.toFixed(2);
                subtotal += total;
            });
            const tax = subtotal * 0.10;
            const grand = subtotal + tax;
            document.getElementById('subtotal').innerText = '$' + subtotal.toFixed(2);
            document.getElementById('tax').innerText = '$' + tax.toFixed(2);
            document.getElementById('grandTotal').innerText = '$' + grand.toFixed(2);
        }
    </script>
</body>
</html>
